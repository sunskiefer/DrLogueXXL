name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tools
        run: |
          sudo apt-get install -y libcairo2
          pip install ziglang pillow cairosvg

      - name: Tests (x86, ASan + UBSan)
        run: test/run_tests.sh

      - name: Build (armv7, glibc 2.31)
        run: |
          if ! ./build.sh > build.log 2>&1; then
            grep -v -E "warning|note:|In file included|^ +[0-9]* [|]|^ +[|]|\^|~~" build.log | tail -25 \
              | while IFS= read -r line; do echo "::error title=build.sh::$line"; done
            exit 1
          fi
          tail -3 build.log

      # A release is made by a v* tag, or by a push to main whose top CHANGELOG version ("## X.Y.Z") has no tag yet.
      - name: Version
        id: ver
        run: |
          REL=0; V="0.0.0-dev"
          case "$GITHUB_REF" in
            refs/tags/v*) V="${GITHUB_REF_NAME#v}"; REL=1 ;;
            refs/heads/main)
              C=$(sed -n 's/^## \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\) *$/\1/p' CHANGELOG.md | head -1)
              if [ -n "$C" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$C" > /dev/null; then V="$C"; REL=1; fi ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "release=$REL" >> "$GITHUB_OUTPUT"; echo "version $V, release $REL"

      - name: Package
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p build/extra/Samples && cp "build/package/L'Cronx - VST - DrLogueXXL/Samples/README.txt" build/extra/Samples/
          python3 third_party/mpc-vst-plugins/tools/release.py \
            --so build/arm/drloguexxl.so \
            --skin "build/skin/L'Cronx - VST - DrLogueXXL" \
            --entry build/pluginlist-entry.xml \
            --version "$VERSION" \
            --about "DrLogueXXL by L'Cronx: a drumlogue-style hybrid drum machine for MPC OS" --extra build/extra/Samples:Samples \
            --id drloguexxl --repo sunskiefer/DrLogueXXL --license GPL-3.0-or-later \
            -o dist

      - name: Catalog check
        if: steps.ver.outputs.release == '1'
        run: python3 third_party/mpc-vst-plugins/tools/catalog_check.py dist/*.zip --catalog

      - uses: actions/upload-artifact@v4
        with:
          name: DrLogueXXL-mpc-armv7
          path: dist/*.zip

      - name: Release
        if: steps.ver.outputs.release == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DrLogueXXL ${{ steps.ver.outputs.version }}
          make_latest: true
          files: dist/*.zip
          body_path: .github/RELEASE_NOTES.md
          prerelease: false
